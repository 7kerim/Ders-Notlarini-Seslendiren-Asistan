# Geliştirme ortamı: PostgreSQL + Redis
services:
  postgres:
    image: postgres:16-alpine
    container_name: sesli-postgres
    environment:
      POSTGRES_DB: sesli_asistan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    container_name: sesli-redis
    ports: ["6379:6379"]

volumes:
  pgdata:
